name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release
        type: boolean
        default: false
      prerelease:
        description: Pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows portable app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Read release version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'package.json must contain a valid release version.'
          }
          $tag = 'v' + $version
          $existing = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect repository tags.' }
          if ($existing) { throw "Tag $tag already exists. Update the package version before creating another release." }
          'tag=' + $tag | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Check source
        run: npm run check

      - name: Build portable EXE
        run: npm run build

      - name: Prepare release files
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'dist/release'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath EorzeaRotationLibrary.exe -Destination (Join-Path $staging 'EorzeaRotationLibrary.exe')
          $hash = (Get-FileHash -LiteralPath (Join-Path $staging 'EorzeaRotationLibrary.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $staging 'SHA256SUMS.txt'), $hash + '  EorzeaRotationLibrary.exe' + [char]10)

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: |
            dist/release/EorzeaRotationLibrary.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable
          path: release

      - name: Publish release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          flags=()
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" EorzeaRotationLibrary.exe SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$RELEASE_COMMIT" \
            --title "Eorzea Rotation Library $RELEASE_TAG" \
            --generate-notes \
            "${flags[@]}"
