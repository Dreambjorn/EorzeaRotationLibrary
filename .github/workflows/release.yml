name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release
        type: boolean
        default: false
      prerelease:
        description: Pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows portable app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      sha256: ${{ steps.files.outputs.sha256 }}
    steps:
      - name: Verify release account
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Set the RELEASE_TOKEN Actions secret to a Dreambjorn personal access token.'
          }
          $publisher = gh api user --jq .login
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate RELEASE_TOKEN.' }
          if ($publisher -ne 'Dreambjorn') { throw 'RELEASE_TOKEN must belong to Dreambjorn.' }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Read release version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'package.json must contain a valid release version.'
          }
          $tag = 'v' + $version
          $existing = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect repository tags.' }
          if ($existing) { throw "Tag $tag already exists. Update the package version before creating another release." }
          'tag=' + $tag | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Verify VirusTotal configuration
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)) {
            throw 'Set the VIRUSTOTAL_API_KEY repository Actions secret before releasing.'
          }

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Check source
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build portable EXE
        run: npm run build

      - name: Prepare release files
        id: files
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'dist/release'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath EorzeaRotationLibrary.exe -Destination (Join-Path $staging 'EorzeaRotationLibrary.exe')
          $hash = (Get-FileHash -LiteralPath (Join-Path $staging 'EorzeaRotationLibrary.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          'sha256=' + $hash | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Scan release EXE with VirusTotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          RELEASE_SHA256: ${{ steps.files.outputs.sha256 }}
        run: node scripts/virustotal.mjs dist/release/EorzeaRotationLibrary.exe "$env:RELEASE_SHA256" dist/release/virustotal.json

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: |
            dist/release/EorzeaRotationLibrary.exe
            dist/release/virustotal.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable
          path: release

      - name: Publish release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          printf '%s  EorzeaRotationLibrary.exe\n' "$RELEASE_SHA256" | sha256sum --check -
          node --input-type=module - "$RELEASE_SHA256" <<'JS' > "$RUNNER_TEMP/virustotal.md"
          import { readFileSync } from 'node:fs';
          const sha = process.argv[2];
          const report = JSON.parse(readFileSync('virustotal.json', 'utf8'));
          if (!/^[a-f0-9]{64}$/.test(sha) || report.sha256 !== sha || report.status !== 'completed' ||
              report.url !== 'https://www.virustotal.com/gui/file/' + sha + '/detection') {
            throw new Error('The completed VirusTotal report must match the release EXE.');
          }
          const categories = ['malicious', 'suspicious', 'undetected', 'harmless', 'timeout', 'confirmed-timeout', 'failure', 'type-unsupported'];
          if (categories.some(key => !Number.isSafeInteger(report.stats?.[key]) || report.stats[key] < 0) ||
              !Number.isFinite(Date.parse(report.analyzedAt)) || new Date(report.analyzedAt).toISOString() !== report.analyzedAt ||
              report.stats.malicious + report.stats.suspicious + report.stats.undetected + report.stats.harmless === 0) {
            throw new Error('The VirusTotal report has invalid engine results or analysis time.');
          }
          console.log('\n## VirusTotal\n\n[View scan report](' + report.url + ')');
          JS
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" \
            -f "target_commitish=$RELEASE_COMMIT" \
            --jq .body > "$notes_file"
          {
            printf '\n## SHA256\n\n'
            printf '| File | SHA256 |\n| --- | --- |\n'
            printf '| EorzeaRotationLibrary.exe | `%s` |\n' "$RELEASE_SHA256"
          } >> "$notes_file"
          cat "$RUNNER_TEMP/virustotal.md" >> "$notes_file"
          flags=()
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" EorzeaRotationLibrary.exe \
            --repo "$GH_REPO" \
            --target "$RELEASE_COMMIT" \
            --title "Eorzea Rotation Library $RELEASE_TAG" \
            --notes-file "$notes_file" \
            "${flags[@]}"
